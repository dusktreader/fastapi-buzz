[project]
name = "fastapi-buzz"
version = "1.0.0"
description = "Extra bindings on py-buzz specifically for fastapi apps"
authors = [
    {name = "Tucker Beck", email ="tucker.beck@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "py-buzz>=9.0",
    "fastapi>=0.100.0,<1.0",
]

[project.urls]
homepage = "https://github.com/dusktreader/fastapi-buzz"
source = "https://github.com/dusktreader/fastapi-buzz"
changelog = "https://github.com/dusktreader/fastapi-buzz/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.100.0,<1.0",
    "httpx>=0.28.1",
    "ipython>=8.18.1",
    "mkdocstrings[python]>=0.30.0",
    "pyclean>=3.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-random-order>=1.2",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "typos>=1.52",
    "zensical>=0.1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = [
    "--random-order",
    "--cov=src/fastapi_buzz",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--cov-report=xml:.coverage.xml",
    "--junitxml=.junit.xml",
    "--override-ini=junit_family=legacy",
]

[tool.ruff]
line-length = 120
src = ["src/fastapi_buzz", "tests"]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"
